<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>y-krn</title>
<meta name="description" content="y-krn が作っているもの。百科拳典（ひゃっかけんてん）— Wikipediaの記事が、事実だけで殴り合う。">
<meta property="og:title" content="y-krn">
<meta property="og:description" content="百科拳典（ひゃっかけんてん）— Wikipediaの記事が、事実だけで殴り合う。">
<meta property="og:image" content="https://hyakkakenten.com/og.png">
<meta name="twitter:card" content="summary">
<link rel="icon" href="https://hyakkakenten.com/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{
  --bg:#071233; --bg2:#0e288c; --ink:#f3f1e7; --muted:#a9b3d6; --gold:#f2c94c; --gold2:#ffe58a; --card:#0b1a4d; --line:#22357a;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{min-height:100svh;background:radial-gradient(1200px 700px at 50% -10%,#1a3bb8 0%,var(--bg2) 30%,var(--bg) 75%);color:var(--ink);font-family:var(--f-body);
  display:flex;flex-direction:column;align-items:center;padding:48px 16px 40px;gap:28px}
/* 背景の光線（アイコンの放射をなぞる） */
body::before{content:"";position:fixed;inset:-50%;z-index:-1;pointer-events:none;
  background:repeating-conic-gradient(from 0deg at 50% 38%,rgba(242,201,76,.07) 0 4deg,transparent 4deg 18deg);
  animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
.who{font-size:13px;letter-spacing:.3em;color:var(--muted);text-transform:lowercase}
a.hero{display:flex;flex-direction:column;align-items:center;gap:18px;text-decoration:none;color:inherit;width:min(560px,100%);
  padding:32px 24px 28px;border-radius:20px;background:linear-gradient(180deg,rgba(11,26,77,.85),rgba(7,18,51,.92));
  border:1px solid var(--line);box-shadow:0 0 0 1px rgba(242,201,76,.25) inset,0 20px 60px rgba(0,0,0,.45);
  transition:transform .2s ease,box-shadow .2s ease}
a.hero:hover{transform:translateY(-3px);box-shadow:0 0 0 2px rgba(242,201,76,.6) inset,0 26px 70px rgba(0,0,0,.5)}
a.hero:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.icon{width:132px;height:132px;border-radius:28px;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 40px rgba(242,201,76,.25)}
.title{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,11vw,64px);line-height:1;letter-spacing:.04em;margin:0;
  background:linear-gradient(180deg,#fff7d1 0%,var(--gold2) 40%,var(--gold) 75%,#c8962a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.yomi{font-size:13px;letter-spacing:.35em;color:var(--muted);margin-top:-8px}
.tag{font-size:clamp(16px,4.2vw,19px);font-weight:700;text-align:center;margin:0;text-wrap:balance}
.desc{font-size:14px;line-height:1.8;color:var(--muted);text-align:center;margin:0;max-width:34em;text-wrap:pretty}
.play{display:inline-flex;align-items:center;gap:10px;margin-top:6px;padding:14px 30px;border-radius:999px;background:var(--gold);color:#1b1500;
  font-family:var(--f-display);font-size:20px;letter-spacing:.06em;box-shadow:0 6px 0 #a67a1c}
a.hero:hover .play{background:var(--gold2)}
.play .arw{transition:transform .2s ease}
a.hero:hover .play .arw{transform:translateX(4px)}
.champ{min-height:1.6em;font-size:13px;color:var(--muted);text-align:center}
.champ b{color:var(--gold2);font-weight:700}
footer{margin-top:auto;font-size:12px;color:var(--muted);text-align:center;line-height:1.8}
footer a{color:var(--muted)}
</style>
</head>
<body>
  <div class="who">y-krn</div>

  <a class="hero" href="https://hyakkakenten.com/" aria-label="百科拳典で遊ぶ">
    <img class="icon" src="https://hyakkakenten.com/icon-512.png" alt="" width="132" height="132">
    <h1 class="title">百科拳典</h1>
    <div class="yomi">ひゃっかけんてん</div>
    <p class="tag">Wikipediaの記事が、事実だけで殴り合う。</p>
    <p class="desc">約138万の記事から2つ選ぶと、高さ・人口・作品数・記事の文字数など、記録された事実だけで真面目に戦います。いまの王者に挑む「王座戦」も。</p>
    <span class="play">遊ぶ <span class="arw">→</span></span>
    <div class="champ" id="champ" aria-live="polite"></div>
  </a>

  <footer>
    <div><a href="https://github.com/y-krn">github.com/y-krn</a></div>
    <div>百科拳典は個人が作った非公式のゲームです。Wikimedia Foundationとは関係ありません。</div>
  </footer>

<script>
// いまの王者を、王座戦のAPIから表示する（取れなければ何も出さない）
fetch('https://hyakkakenten.com/api/throne').then(r=>r.json()).then(d=>{
  if(!d||!d.champ) return; const e=document.getElementById('champ'); const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  e.innerHTML='いまの王者：<b>'+esc(d.champ.display)+'</b>（第'+d.reignNo+'代・防衛'+d.champ.defenses+'回）';
}).catch(()=>{});
</script>

</body>
</html>
